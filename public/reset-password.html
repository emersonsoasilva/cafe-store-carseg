<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redefinir senha — Café Store</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">☕ Café Store</div>
  <nav id="nav-actions"></nav>
</header>

<main>
  <div class="card">
    <h1>Redefinir senha</h1>
    <div id="msg" class="message" hidden></div>
    <form id="reset-form">
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password" />
      <p class="hint">
        Mínimo 10 caracteres, com letra maiúscula, minúscula e número.
        Não pode conter: "ç"/"Ç", aspas simples ('), espaços, ou sequência
        numérica (ex.: 123, 4321).
      </p>
      <button type="submit">Redefinir senha</button>
    </form>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
