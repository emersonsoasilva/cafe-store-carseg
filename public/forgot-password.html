<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recuperar senha — Café Store</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">☕ Café Store</div>
  <nav id="nav-actions"></nav>
</header>

<main>
  <div class="card">
    <h1>Recuperar senha</h1>
    <div id="msg" class="message" hidden></div>
    <form id="forgot-form">
      <label for="email">Informe seu e-mail cadastrado</label>
      <input id="email" type="email" required maxlength="200" />
      <button type="submit">Enviar instruções</button>
    </form>
    <p class="hint">
      Em ambiente de demonstração, o link de redefinição é impresso no console/log do servidor
      (não enviamos e-mails reais).
    </p>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
