<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administração — Café Store</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">☕ Café Store — Admin</div>
  <nav id="nav-actions"></nav>
</header>

<main>
  <div id="msg" class="message" hidden></div>

  <div class="card">
    <h1>Novo produto</h1>
    <form id="product-form">
      <label for="name">Nome</label>
      <input id="name" required maxlength="150" />
      <label for="description">Descrição</label>
      <input id="description" maxlength="1000" />
      <label for="origin">Origem</label>
      <input id="origin" maxlength="150" />
      <div class="row">
        <div>
          <label for="roastLevel">Torra</label>
          <select id="roastLevel">
            <option value="claro">Claro</option>
            <option value="medio">Médio</option>
            <option value="escuro">Escuro</option>
          </select>
        </div>
        <div>
          <label for="weightGrams">Peso (g)</label>
          <input id="weightGrams" type="number" value="250" min="1" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="priceReais">Preço (R$)</label>
          <input id="priceReais" type="number" step="0.01" min="0.01" required />
        </div>
        <div>
          <label for="stock">Estoque</label>
          <input id="stock" type="number" min="0" value="0" required />
        </div>
      </div>
      <button type="submit">Cadastrar produto</button>
    </form>
  </div>

  <div class="card">
    <h2>Produtos</h2>
    <div id="admin-products">Carregando...</div>
  </div>

  <div class="card">
    <h2>Pedidos de todos os clientes</h2>
    <div id="admin-orders">Carregando...</div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
